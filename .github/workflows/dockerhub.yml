name: Sync upstream and publish Docker Hub

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the latest stable release even if already published
        type: boolean
        default: false
      publish:
        description: Push to Docker Hub (disable to test without Docker Hub credentials)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dockerhub-release
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'izillionways/synch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.release.outputs.changed }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      image: ${{ steps.release.outputs.image }}
      publish: ${{ steps.release.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Test release detection
        run: node .github/scripts/dockerhub-release.mjs --test

      - name: Check latest stable upstream release
        id: release
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          FORCE: ${{ inputs.force || false }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: node .github/scripts/dockerhub-release.mjs

      # GitHub disables public-repository schedules after 60 days without activity.
      - name: Keep release monitoring active during quiet months
        run: |
          if (( $(date +%s) - $(git log -1 --format=%ct) >= 30 * 86400 )); then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'chore: keep upstream release monitoring active [skip ci]'
            git push origin HEAD:main
          fi

      - name: Sync fork with upstream
        if: steps.release.outputs.changed == 'true'
        run: gh api "repos/$GITHUB_REPOSITORY/merge-upstream" --method POST -f branch=main

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the exact upstream release
        uses: actions/checkout@v6
        with:
          repository: hjinco/synch
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false

      - name: Log in to Docker Hub
        if: needs.check.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build image for startup test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          load: true
          tags: synch-api:smoke
          cache-from: type=gha,scope=synch-api

      - name: Smoke test the server
        run: |
          docker run --detach --name synch-api-smoke \
            --publish 127.0.0.1:8787:8787 \
            --env PUBLIC_URL=http://127.0.0.1:8787 \
            --env BETTER_AUTH_SECRET=ci-better-auth-secret-that-is-long-enough \
            --env SYNC_TOKEN_SECRET=ci-sync-token-secret-that-is-long-enough \
            --env AUTH_ALLOWED_EMAILS=ci@example.com \
            synch-api:smoke
          trap 'docker rm --force --volumes synch-api-smoke >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs synch-api-smoke
          exit 1

      - name: Build both architectures and publish
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.check.outputs.publish == 'true' }}
          tags: |
            ${{ needs.check.outputs.image }}:${{ needs.check.outputs.tag }}
            ${{ needs.check.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/hjinco/synch
            org.opencontainers.image.revision=${{ needs.check.outputs.sha }}
            org.opencontainers.image.version=${{ needs.check.outputs.tag }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=synch-api
          cache-to: type=gha,mode=max,scope=synch-api

      - name: Verify published manifest
        if: needs.check.outputs.publish == 'true'
        env:
          IMAGE: ${{ needs.check.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: docker buildx imagetools inspect "$IMAGE@$DIGEST"

  record:
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Record successful publication for the next release check
        env:
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
          RELEASE_SHA: ${{ needs.check.outputs.sha }}
          IMAGE: ${{ needs.check.outputs.image }}
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const { RELEASE_TAG: tag, RELEASE_SHA: sha, IMAGE: image } = process.env;
            writeFileSync(".github/dockerhub-published.json", JSON.stringify({ tag, sha, image }, null, 2) + "\n");
          '
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/dockerhub-published.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record Docker Hub release $RELEASE_TAG [skip ci]"
            git push origin HEAD:main
          fi
