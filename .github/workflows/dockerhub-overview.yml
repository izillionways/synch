name: Update Docker Hub overview

on:
  push:
    branches: [main]
    paths:
      - docs/dockerhub-overview.md
      - .github/workflows/dockerhub-overview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-overview
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'izillionways/synch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/synch', vars.DOCKERHUB_USERNAME) }}
      DESCRIPTION: Community build of the Synch server for encrypted Obsidian sync. amd64 / arm64.
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Read current public overview
        run: |
          curl --fail --silent --show-error --max-time 30 "https://hub.docker.com/v2/repositories/$IMAGE/" \
            | jq '{description, full_description}'

      - name: Publish overview
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: ${{ env.DESCRIPTION }}
          readme-filepath: docs/dockerhub-overview.md

      - name: Verify public overview matches the document
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const response = await fetch(`https://hub.docker.com/v2/repositories/${process.env.IMAGE}/`, {
            signal: AbortSignal.timeout(30_000),
          });
          assert(response.ok, `Docker Hub returned ${response.status}`);
          const repository = await response.json();
          assert.equal(repository.full_description, readFileSync('docs/dockerhub-overview.md', 'utf8'));
          assert.equal(repository.description, process.env.DESCRIPTION);
          console.log(`Verified public overview for ${process.env.IMAGE}`);
          JS
